<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="WMS — საწყობის მართვის სისტემა: მარაგების კონტროლი, კრიტიკული ნაშთის შეტყობინებები, ჩამოწერა და როლებზე დაფუძნებული წვდომა."
    />
    <meta name="theme-color" content="#ea580c" />
    <!-- თემა ჩაირთოს React-ის ჩატვირთვამდე, რომ გვერდი თეთრად არ „აციმციმდეს" -->
    <script>
      try {
        var t = localStorage.getItem('wms-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>WMS — საწყობის მართვის სისტემა</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
